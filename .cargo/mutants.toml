# cargo-mutants configuration, read from the crate root.
#
# src/verification.rs is `#[cfg(kani)]` (see `mod verification` in src/lib.rs), so `cargo test`
# never compiles it: a change to it cannot fail any test, and every mutant of it survives for that
# reason alone. Kani checks its proofs in CI, and each proof carries a falsification patch under
# falsifications/ that must make Kani fail. That is this file's mutation testing.
exclude_globs = ["src/verification.rs"]
