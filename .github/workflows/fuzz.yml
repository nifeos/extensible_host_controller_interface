name: fuzz
on:
  schedule:
    - cron: '45 6 * * 2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    uses: partsfoundry/crate-workflows/.github/workflows/fuzz.yml@a69ab4829b02cf7a357061e9fd32ce52ba058e12
    with:
      # Crash inputs are public. True because the crate holds no unsafe code: src/lib.rs forbids it.
      public-crash-inputs: true
