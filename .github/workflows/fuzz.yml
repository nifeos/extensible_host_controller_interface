name: fuzz
on:
  schedule:
    - cron: '45 6 * * 2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    uses: nifeos/crate-workflows/.github/workflows/fuzz.yml@2e651d8987e7035a6ef1da6a602ee31315d39f61
    with:
      # Crash inputs are public. True because the crate holds no unsafe code: src/lib.rs forbids it.
      public-crash-inputs: true
