name: fuzz
on:
  schedule:
    - cron: '45 6 * * 2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    uses: nifeos/crate-workflows/.github/workflows/fuzz.yml@11d6d6bbf760462fa1e45275d34b55b88dcde44a
    with:
      # Crash inputs are public. True because the crate holds no unsafe code: src/lib.rs forbids it.
      public-crash-inputs: true
