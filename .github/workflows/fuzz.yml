name: fuzz
on:
  schedule:
    - cron: '45 6 * * 2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    uses: nifeos/crate-workflows/.github/workflows/fuzz.yml@4d9eea223edab7761a9f358995834bc52e4c8c39
    with:
      # Crash inputs are public. True because the crate holds no unsafe code: src/lib.rs forbids it.
      public-crash-inputs: true
