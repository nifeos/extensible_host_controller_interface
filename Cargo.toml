[package]
name = "extensible_host_controller_interface"
version = "0.1.0-pre.2"
edition = "2024"
rust-version = "1.85"
description = "xHCI host controller logic as pure computation: register offsets and decode, TRBs, rings, contexts and port status, proven with Kani"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nifeos/extensible_host_controller_interface"
readme = "README.md"
keywords = ["xhci", "usb", "no-std", "kani", "driver"]
categories = ["no-std", "embedded", "hardware-support"]
publish = false     # held until the maintainers decide the first release

# no_std for a driver, std for host tests. The arithmetic of a USB host controller (xHCI) driver:
# register offsets and field decode, TRB construction and decode, the producer and event ring cycle
# discipline, slot and endpoint contexts, and port status. The caller performs every volatile access;
# this crate computes what they carry, so it is host-tested and reachable by the model checker.

[lints.rust]
# `cfg(kani)` is set by the Kani model checker, which proves this crate's harnesses.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
# src/lib.rs forbids unsafe code, so this lint has nothing to read; the shared standalone gate asks
# every crate to carry it, and it costs nothing here.
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[lints.clippy]
cast_ptr_alignment = "warn"
ptr_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"
doc_markdown = "warn"
